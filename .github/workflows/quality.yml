name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Pinned browser test dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find assets/js data tools -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools
          python tools/test-uretim/aile-katman-esik-test.py
          python tools/release-helper-test.py
          python tools/test-uretim/cumle-kalite-test.py
          python tools/test-uretim/kart-icerik-test.py

      - name: Deterministic generated files
        shell: bash
        run: |
          set -euo pipefail
          python tools/aile-cikar.py --check
          node tools/deneme-bankasi-uret.js
          node tools/seo-uret.js
          node tools/sayilar-uret.js --check
          node tools/cumle-dizin-uret.js --check
          node tools/site-sablon-uret.js
          python tools/release-uret.py --write
          node tools/release-bagla.js
          python tools/sw-surum.py --kontrol
          git diff --exit-code -- data/sorular-ek.js data/deneme-formlari.js konu sitemap.xml '*.html' release-manifest.json sw.js
          # Üretilen fakat commit'e eklenmemiş release dosyaları da hata olmalı.
          test -z "$(git ls-files --others --exclude-standard -- releases)"

      - name: Browser, keyboard and accessibility regressions
        run: pnpm test:browser

      - name: Content, learning and sync tests
        shell: bash
        run: |
          set -euo pipefail
          # Test listesi sabit tutulmuyor: tools/test-uretim/*-test.js dosyalarinin
          # tamami kosar (5 Eylul 2026 denetimi B3: 5 test listede olmadigi icin hic kosmuyordu).
          mapfile -t tests < <(ls tools/test-uretim/*-test.js | LC_ALL=C sort)
          # Tek satırlık "for ... node" hangi testin patladığını göstermiyordu:
          # iş akışı günlüğü yalnız yetkili kullanıcıya açık, dışarıdan API ile
          # okunamıyor. Artık her başarısız test adıyla ve çıktısıyla iş özetine
          # yazılıyor; özet check-runs API'sinden okunabiliyor. -e kaldırıldı ki
          # ilk hatada durmayıp bütün başarısızlıklar tek koşumda görünsün.
          set -uo pipefail
          hata=0
          for test_file in "${tests[@]}"; do
            if cikti="$(node "$test_file" 2>&1)"; then
              echo "OK  $test_file"
              echo "$cikti"
            else
              hata=1
              echo "BASARISIZ  $test_file"
              echo "$cikti"
              {
                echo "### Başarısız test: \`$test_file\`"
                echo
                echo '```'
                echo "$cikti" | tail -40
                echo '```'
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
          done
          exit "$hata"
