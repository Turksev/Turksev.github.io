<!DOCTYPE html><meta charset="utf-8"><title>Durumum kutu sekmeleri</title>
<pre id="log"></pre>
<script>
/* Durumum sayfasındaki kutu sekmelerini sınar: toplam sayı, kutu yüzdeleri
   (toplamları %100 etmeli) ve havuz oranı notu. */
var L=[],hata=0;
function P(m){L.push(m);document.getElementById('log').textContent=L.join('\n');}
function esit(a,o,b){var ok=(o===b);if(!ok)hata++;
  P((ok?'OK   ':'HATA ')+a+' = '+JSON.stringify(o)+(ok?'':' (beklenen '+JSON.stringify(b)+')'));}

localStorage.clear();
// Bilinen bir ilerleme kur: 1.kutuda 5, 2'de 3, 5'te 2 = 10 kayıt
var leitner={};
var kelimeler=['abandon','ability','able','about','above','abroad','absence','absolute','absorb','abstract'];
var kutular=[1,1,1,1,1,2,2,2,5,5];
kelimeler.forEach(function(k,i){leitner[k]={k:kutular[i],g:99999};});
localStorage.setItem('yds-leitner',JSON.stringify(leitner));
// Havuz dört haneli olsun ki binlik ayracı da sınanabilsin.
localStorage.setItem('yds-katmanlar',JSON.stringify([1,2,3,4,5,6,7]));

var f=document.createElement('iframe');
f.style.cssText='width:1100px;height:900px;border:0';
f.src='file:///C:/Users/Trk/Desktop/Turksev.github.io/durum.html';
f.onload=function(){var d=f.contentDocument;
setTimeout(function(){try{
  var sek=d.querySelectorAll('#sekmeler .ks');
  esit('sekme sayısı', sek.length, 6);
  var oranlar=[];
  for(var i=0;i<sek.length;i++){
    var b=sek[i].querySelector('b').textContent;
    var et=sek[i].querySelector('i').textContent;
    var o=sek[i].querySelector('.ks-oran');
    P('  '+et+': '+b+'  oran='+(o?o.textContent:'YOK'));
    if(!o){hata++;P('HATA '+et+' oran satırı yok');}
    else if(i>0) oranlar.push(parseFloat(o.textContent.replace('%','').replace(',','.')));
  }
  esit('hepsi sayısı', sek[0].querySelector('b').textContent, '10');
  esit('1. kutu sayısı', sek[1].querySelector('b').textContent, '5');
  esit('1. kutu oranı', sek[1].querySelector('.ks-oran').textContent, '%50');
  esit('2. kutu oranı', sek[2].querySelector('.ks-oran').textContent, '%30');
  esit('3. kutu oranı', sek[3].querySelector('.ks-oran').textContent, '%0');
  esit('5. kutu oranı', sek[5].querySelector('.ks-oran').textContent, '%20');
  var top=oranlar.reduce(function(a,b){return a+b;},0);
  esit('kutu yüzdeleri %100 ediyor', Math.round(top), 100);
  var not=d.querySelector('#sekmeler .ks-not').textContent;
  P('  not: '+not);
  esit('havuz oranı notu var', /Havuzun .* açıldı \(10 \/ \d/.test(not), true);
  esit('binlik ayraç çalışıyor', /\/ \d\.\d{3}\)/.test(not), true);
  P('DONE '+(hata?hata+' HATA':'HEPSI GECTI'));
}catch(e){P('ERR '+e.message);}},1600);};
document.body.appendChild(f);
</script>
