<!DOCTYPE html><meta charset="utf-8"><title>alt bilgi / depo göstergesi</title>
<pre id="log"></pre>
<script>
/* Alt bilgideki depo göstergesini ve eski bağlantı üçlüsünün kalkmış
   olduğunu birkaç sayfada denetler. */
var L=[],hata=0;
function P(m){L.push(m);document.getElementById('log').textContent=L.join('\n');}
function esit(a,o,b){var ok=(o===b);if(!ok)hata++;
  P((ok?'OK   ':'HATA ')+a+' = '+JSON.stringify(o)+(ok?'':' (beklenen '+JSON.stringify(b)+')'));}
var KOK='file:///C:/Users/Trk/Desktop/YDS/04_Github/';
var SAYFALAR=['index.html','kelimeler.html','ara.html','durum.html'];
var i=0;
function sirada(){
  if(i>=SAYFALAR.length){P('DONE '+(hata?hata+' HATA':'HEPSI GECTI'));return;}
  var s=SAYFALAR[i++];
  var f=document.createElement('iframe');
  f.style.cssText='width:1100px;height:700px;border:0';
  f.src=KOK+s;
  f.onload=function(){
    var w=f.contentWindow,d=f.contentDocument;
    setTimeout(function(){
      try{
        var alt=d.querySelector('.site-footer .wrap');
        var depo=alt&&alt.querySelector('.depo');
        esit(s+' depo göstergesi var', !!depo, true);
        esit(s+' eski bağlantılar kalktı', !alt.querySelector('.footer-links'), true);
        esit(s+' yontem/ayarlar bağlantısı yok',
             !alt.querySelector('a[href*="yontem"],a[href*="ayarlar"]'), true);
        if(depo){
          esit(s+' tek kopya', alt.querySelectorAll('.depo').length, 1);
          var yazi=depo.querySelector('.depo-yazi').textContent;
          P('     yazı: '+yazi);
          esit(s+' yüzde var', /%\d/.test(yazi), true);
          esit(s+' "dolu" var', yazi.indexOf('dolu')!==-1, true);
          var bar=depo.querySelector('.depo-bar i');
          var g=parseFloat(bar.style.width);
          esit(s+' bar genişliği makul', g>0&&g<=100, true);
        }
      }catch(e){hata++;P('ERR '+s+' '+e.message);}
      document.body.removeChild(f); sirada();
    },1200);
  };
  document.body.appendChild(f);
}
sirada();
</script>
