<!DOCTYPE html><meta charset="utf-8"><title>kart metin secimi testi</title>
<!-- Kart metni fareyle secilebilmeli (kelime, anlam, ornek cumle, ceviri),
     ama secim varken karta tiklamak karti CEVIRMEMELI: yoksa kopyalamak
     icin surukleyince secim aninda kaybolur. YDS.metinSecildi() bunu
     kontrol ediyor; bu test dort davranisi da sinar.
     Kosum: headless Chrome ile dosyayi ac, <pre> icerigini oku. -->
<pre id="log"></pre>
<script>
var L=[],KOTU=0;
function P(m){L.push(m);document.getElementById('log').textContent=L.join('\n');}
function T(ad,kos,not){if(!kos)KOTU++;P((kos?'OK  ':'HATA')+'  '+ad+(not!==undefined?' = '+not:''));}

function sayfayiSina(dosya, kartBtnDeseni, bitti){
  var f=document.createElement('iframe');
  f.style.cssText='width:1100px;height:1400px;border:0';
  f.src='file:///C:/Users/Trk/Desktop/YDS/04_uygulama/'+dosya;
  f.onload=function(){var w=f.contentWindow,d=f.contentDocument;
  setTimeout(function(){try{
    P('######## '+dosya+' ########');
    var kartBtn=null;
    d.querySelectorAll('button, .btn').forEach(function(b){
      if(kartBtnDeseni.test(b.textContent)) kartBtn=b; });
    if(!kartBtn){T('kart moduna geçiren düğme',false);bitti();return;}
    kartBtn.click();

    setTimeout(function(){try{
      var kart=d.getElementById('kart');
      var st=w.getComputedStyle(kart);
      T('kart seçilebilir',(st.userSelect||st.webkitUserSelect)!=='none',
        st.userSelect||st.webkitUserSelect);
      ['kartOn','kartTr','kartOrnek'].forEach(function(id){
        var el=d.getElementById(id); if(!el){T(id+' var',false);return;}
        var u=w.getComputedStyle(el).userSelect;
        T('  '+id+' seçilebilir',u!=='none',u);
      });
      T('imleç hâlâ pointer',st.cursor==='pointer',st.cursor);

      // 1) seçim yokken tıklama kartı çevirmeli
      var oncekiAcik=kart.getAttribute('aria-expanded');
      w.getSelection().removeAllRanges();
      kart.click();
      var sonraAcik=kart.getAttribute('aria-expanded');
      T('seçim yokken tıklama kartı çeviriyor',oncekiAcik!==sonraAcik,
        oncekiAcik+' -> '+sonraAcik);

      // 2) metin seçiliyken tıklama kartı ÇEVİRMEMELİ
      var hedef=d.getElementById('kartOn');
      var r=d.createRange(); r.selectNodeContents(hedef);
      var s=w.getSelection(); s.removeAllRanges(); s.addRange(r);
      T('  seçilen metin',String(r).trim().length>0,'"'+String(r).trim()+'"');
      var once2=kart.getAttribute('aria-expanded');
      kart.click();
      var sonra2=kart.getAttribute('aria-expanded');
      T('seçim varken tıklama kartı çevirmiyor',once2===sonra2,once2+' -> '+sonra2);

      // 3) seçim temizlenince yine çevirmeli
      s.removeAllRanges();
      var once3=kart.getAttribute('aria-expanded');
      kart.click();
      T('seçim temizlenince yine çeviriyor',
        once3!==kart.getAttribute('aria-expanded'),
        once3+' -> '+kart.getAttribute('aria-expanded'));

      // 4) klavye hâlâ çalışmalı
      var once4=kart.getAttribute('aria-expanded');
      kart.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
      T('Enter tuşu çeviriyor',once4!==kart.getAttribute('aria-expanded'),
        once4+' -> '+kart.getAttribute('aria-expanded'));
      bitti();
    }catch(e){P('ERR2 '+e.message);bitti();}},700);
  }catch(e){P('ERR '+e.message);bitti();}},1600);};
  document.body.appendChild(f);
}

sayfayiSina('kelimeler.html',/kartta/i,function(){
  sayfayiSina('obekler.html',/kartta/i,function(){
    P(KOTU?'DONE '+KOTU+' HATA':'DONE HEPSI GECTI');
  });
});
</script>
