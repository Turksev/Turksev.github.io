<!DOCTYPE html><meta charset="utf-8"><title>row birleşmesi</title>
<pre id="log"></pre>
<script>
/* "row /raʊ/" kartı "row" ile birleştirildi. Bu test hem başlığın
   temizlendiğini hem de eski başlıkta biriken ilerlemenin alias ile
   taşındığını doğrular. */
var L=[],hata=0;
function P(m){L.push(m);document.getElementById('log').textContent=L.join('\n');}
function esit(a,o,b){var ok=(o===b);if(!ok)hata++;
  P((ok?'OK   ':'HATA ')+a+' = '+JSON.stringify(o)+(ok?'':' (beklenen '+JSON.stringify(b)+')'));}

localStorage.clear();
// Eski başlıkta 3. kutuda ilerleme varmış gibi davran
localStorage.setItem('yds-leitner', JSON.stringify({'row /ra\u028a/': {k: 3, g: 99999}}));
localStorage.setItem('yds-katmanlar', JSON.stringify([5]));

var f=document.createElement('iframe');
f.style.cssText='width:1100px;height:800px;border:0';
f.src='file:///C:/Users/Trk/Desktop/YDS/04_uygulama/kelimeler.html';
f.onload=function(){var w=f.contentWindow,d=f.contentDocument;
setTimeout(function(){try{
  var Veri=w.YDS.Veri, Il=w.YDS.Ilerleme, C=w.YDS.Cekim;

  esit('"row /raʊ/" dizinden kalktı', !Veri.dizinKaydi('row /ra\u028a/'), true);
  var dz=Veri.dizinKaydi('row');
  esit('"row" dizinde', !!dz, true);
  P('  kısa anlam: '+(dz?dz.t:'-'));
  esit('kısa anlamda telaffuz işareti yok', (dz.t||'').indexOf('/')===-1 ||
       (dz.t||'').indexOf('\u028a')===-1, true);

  var k=Veri.kayit('row');
  esit('tek kartta dört anlam', k.a.length, 4);
  k.a.forEach(function(a,i){P('  ['+i+'] '+'*'.repeat(a.yz||0)+' '+a.tr);});
  esit('anlamlar yıldıza göre sıralı',
       k.a.every(function(a,i){return i===0 || (k.a[i-1].yz||0)>=(a.yz||0);}), true);
  esit('kavga anlamı duruyor',
       k.a.some(function(a){return a.tr.indexOf('kavga')!==-1;}), true);

  // Çekim: artık bozuk ek yok
  esit('çekim past', C.cek('row','past'), 'rowed');
  esit('çekim pl', C.cek('row','pl'), 'rows');

  // İlerleme göçü
  esit('eski başlıktaki kutu "row"a taşındı', Il.kutu('row'), 3);

  P('DONE '+(hata?hata+' HATA':'HEPSI GECTI'));
}catch(e){hata++;P('ERR '+e.message);P('DONE 1 HATA');}},1800);};
document.body.appendChild(f);
</script>
