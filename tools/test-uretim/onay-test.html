<!DOCTYPE html><meta charset="utf-8"><title>onay testi</title>
<pre id="log"></pre>
<script>
var L=[],hata=0;function P(m){L.push(m);document.getElementById('log').textContent=L.join('\n');}
function esit(a,o,b){var ok=(o===b);if(!ok)hata++;P((ok?'OK   ':'HATA ')+a+' = '+JSON.stringify(o)+(ok?'':' (beklenen '+JSON.stringify(b)+')'));}
localStorage.clear();
var f=document.createElement('iframe');
f.style.cssText='width:1000px;height:600px;border:0';
f.src='file:///C:/Users/Trk/Desktop/Turksev.github.io/kelimeler.html';
f.onload=function(){var w=f.contentWindow,d=f.contentDocument;
setTimeout(function(){try{
  var Il=w.YDS.Ilerleme;
  (w.KELIME_DIZIN||[]).slice(0,12).forEach(function(x){Il.dogru(x.e);});
  esit('kurulan kayıt', Object.keys(Il.tumKayitlar()).length, 12);

  var sorular=[];
  // 1. senaryo: ilk soruya HAYIR
  w.confirm=function(m){sorular.push(m);return false;};
  d.getElementById('sifirla').click();
  esit('ilkte iptal -> soru sayısı', sorular.length, 1);
  esit('ilkte iptal -> kayıt duruyor', Object.keys(Il.tumKayitlar()).length, 12);
  P('1. soru: '+sorular[0].replace(/\n/g,' / '));

  // 2. senaryo: ilke EVET, ikinciye HAYIR
  sorular=[]; var k=0;
  w.confirm=function(m){sorular.push(m);k++;return k===1;};
  d.getElementById('sifirla').click();
  esit('ikide iptal -> soru sayısı', sorular.length, 2);
  esit('ikide iptal -> kayıt duruyor', Object.keys(Il.tumKayitlar()).length, 12);
  P('2. soru: '+sorular[1].replace(/\n/g,' / '));

  // 3. senaryo: ikisine de EVET
  sorular=[]; w.confirm=function(m){sorular.push(m);return true;};
  d.getElementById('sifirla').click();
  esit('iki evet -> soru sayısı', sorular.length, 2);
  esit('iki evet -> silindi', Object.keys(Il.tumKayitlar()).length, 0);
  P(hata?hata+' HATA':'HEPSI GECTI'); P('DONE'); localStorage.clear();
}catch(e){P('ERR '+e.message);}},1500);};
document.body.appendChild(f);
</script>
