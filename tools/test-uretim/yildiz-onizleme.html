<!DOCTYPE html><meta charset="utf-8"><title>yıldız önizleme</title>
<pre id="log"></pre>
<script>
var L=[];function P(m){L.push(m);document.getElementById('log').textContent=L.join('\n');}
localStorage.clear();
var f=document.createElement('iframe');
f.style.cssText='width:1100px;height:900px;border:0';
f.src='file:///C:/Users/Trk/Desktop/YDS/04_uygulama/kelimeler.html';
f.onload=function(){var w=f.contentWindow,d=f.contentDocument;
setTimeout(function(){try{
  var a=d.getElementById('ara'); a.value='rule'; a.dispatchEvent(new w.Event('input'));
  setTimeout(function(){
    var s=d.querySelector('#liste .word');
    P('satır: '+(s? s.querySelector('.en').textContent : 'yok'));
    var ex=s? s.querySelectorAll('.ex') : [];
    for(var i=0;i<ex.length;i++){
      var y=ex[i].querySelector('.yildiz');
      P('  anlam '+(i+1)+': '+ex[i].querySelector('b').textContent+
        '  yıldız='+(y? y.textContent+' ['+y.getAttribute('title')+']' : 'YOK'));
    }
    P('DONE');
  },900);
}catch(e){P('ERR '+e.message);}},1600);};
document.body.appendChild(f);
</script>
