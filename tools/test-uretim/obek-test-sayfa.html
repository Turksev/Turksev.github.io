<!DOCTYPE html><meta charset="utf-8"><title>öbek testi</title>
<pre id="log"></pre>
<script>
var L=[],hata=0;function P(m){L.push(m);document.getElementById('log').textContent=L.join('\n');}
function esit(a,o,b){var ok=(o===b);if(!ok)hata++;P((ok?'OK   ':'HATA ')+a+' = '+JSON.stringify(o)+(ok?'':' (beklenen '+JSON.stringify(b)+')'));}
localStorage.clear();
var f=document.createElement('iframe');
f.style.cssText='width:1100px;height:800px;border:0';
f.src='file:///C:/Users/Trk/Desktop/Turksev.github.io/obekler.html';
f.onload=function(){var w=f.contentWindow,d=f.contentDocument;
 setTimeout(function(){try{
  var Il=w.YDS.Ilerleme, T=w.YDS.GununTesti;
  esit('test modülü var', !!T, true);
  // 25 öbeği bugün çalışılmış yap
  var hedef=(w.OBEKLER||[]).filter(function(o){return o.y==='deyimsel fiil';}).slice(0,25);
  hedef.forEach(function(o,i){ i%4? Il.dogru(o.f): Il.yanlis(o.f); });
  d.getElementById('gunlukTavan').dispatchEvent(new w.Event('change'));
  var b=d.getElementById('testBasla');
  P('düğme: hidden='+b.hidden+' | '+b.textContent);
  b.click();
  setTimeout(function(){
    esit('test açıldı', d.getElementById('testAlan').hidden, false);
    P('sayaç: '+d.getElementById('tSayac').textContent);
    P('soru: '+d.getElementById('tMetin').textContent.slice(0,100));
    var opt=[].map.call(d.querySelectorAll('#tSecenekler .opt'),function(o){return o.textContent;});
    P('şıklar: '+opt.join(' | '));
    esit('5 şık', opt.length, 5);
    esit('şıklar benzersiz', new Set(opt).size, 5);
    var n=0;
    (function adim(){
      var o=d.querySelectorAll('#tSecenekler .opt')[0];
      if(!o||d.getElementById('tSoru').hidden) return bitir();
      o.click(); n++;
      if(n===1) P('açıklama: '+d.getElementById('tAcik').textContent.slice(0,110));
      d.getElementById('tIleri').click(); setTimeout(adim,0);
    })();
    function bitir(){
      P('cevaplanan: '+n+' | skor: '+d.getElementById('tSkor').textContent);
      esit('sonuç göründü', d.getElementById('tSonuc').hidden, false);
      esit('testte-yanlış defteri doldu', Object.keys(Il.testYanlisKumesi()).length>0, true);
      d.getElementById('tBitir').click();
      esit('kapandı', d.getElementById('testAlan').hidden, true);
      P(hata?hata+' HATA':'HEPSI GECTI'); P('DONE');
      localStorage.clear();
    }
  },1200);
 }catch(e){P('ERR '+e.message+' | '+(e.stack||'').split('\n')[1]);}},1800);
};
document.body.appendChild(f);
</script>
