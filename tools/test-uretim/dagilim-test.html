<!DOCTYPE html><meta charset="utf-8"><title>YDS dağılım tablosu</title>
<pre id="log"></pre>
<script>
/* Ana sayfadaki bölüm dağılımı tablosu: aralıklar sırayla ilerlemeli,
   toplam 80 olmalı ve veri dosyası tools/deneme-bankasi-uret.js'teki
   resmî sırayla aynı olmalı. */
var L=[],hata=0;
function P(m){L.push(m);document.getElementById('log').textContent=L.join('\n');}
function esit(a,o,b){var ok=(JSON.stringify(o)===JSON.stringify(b));if(!ok)hata++;
  P((ok?'OK   ':'HATA ')+a+' = '+JSON.stringify(o)+(ok?'':' (beklenen '+JSON.stringify(b)+')'));}

var BEKLENEN = [
  ['Kelime',6],['Dil Bilgisi',4],['Bağlaç',4],['Preposition',2],['Cloze Test',10],
  ['Cümle Tamamlama',10],['Çeviri',6],['Okuma',20],['Diyalog',5],['Restatement',4],
  ['Paragraf Tamamlama',4],['Anlamı Bozan Cümle',5]
];

localStorage.clear();
var f=document.createElement('iframe');
f.style.cssText='width:1100px;height:900px;border:0';
f.src='file:///C:/Users/Trk/Desktop/YDS/04_Github/index.html';
f.onload=function(){var w=f.contentWindow,d=f.contentDocument;
setTimeout(function(){try{
  esit('veri dosyası yüklü', !!w.YDS_DAGILIM, true);
  esit('bölüm sırası ve sayıları',
       w.YDS_DAGILIM.map(function(b){return [b.ad,b.n];}), BEKLENEN);
  esit('toplam soru', w.YDS_DAGILIM.reduce(function(t,b){return t+b.n;},0), 80);

  var satirlar=d.querySelectorAll('#ydsDagilim tbody tr');
  esit('satır sayısı (12 bölüm + toplam)', satirlar.length, 13);

  var beklenenBas=1, sorun=0;
  for(var i=0;i<BEKLENEN.length;i++){
    var h=satirlar[i].cells;
    var aralik=h[0].textContent, ad=h[1].textContent, n=parseInt(h[2].textContent,10);
    var son=beklenenBas+BEKLENEN[i][1]-1;
    var bekle=BEKLENEN[i][1]===1?String(beklenenBas):beklenenBas+'\u2013'+son;
    if(aralik!==bekle||ad!==BEKLENEN[i][0]||n!==BEKLENEN[i][1]){
      sorun++;P('     BOZUK satır '+i+': '+aralik+' '+ad+' '+n+'  (beklenen '+bekle+' '+BEKLENEN[i][0]+')');
    }
    if(i<3||i===BEKLENEN.length-1) P('  '+aralik+'  '+ad+'  '+n);
    beklenenBas=son+1;
  }
  esit('bütün aralıklar doğru', sorun, 0);
  esit('son soru numarası', beklenenBas-1, 80);
  var toplam=satirlar[12].cells;
  esit('toplam satırı', toplam[2].textContent, '80');
  P('DONE '+(hata?hata+' HATA':'HEPSI GECTI'));
}catch(e){hata++;P('ERR '+e.message);P('DONE 1 HATA');}},1500);};
document.body.appendChild(f);
</script>
