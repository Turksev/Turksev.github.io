<!DOCTYPE html><meta charset="utf-8"><title>kelime/öbek kimlik çakışması</title>
<pre id="log"></pre>
<script>
/* Aynı adı taşıyan kelime kartı ile öbek ayrı Leitner anahtarı kullanmalı:
   "used to" kelimesini bilmek, "used to" öbeğini işaretlememeli. */
var L=[],hata=0;
function P(m){L.push(m);document.getElementById('log').textContent=L.join('\n');}
function esit(a,o,b){var ok=(o===b);if(!ok)hata++;
  P((ok?'OK   ':'HATA ')+a+' = '+JSON.stringify(o)+(ok?'':' (beklenen '+JSON.stringify(b)+')'));}
localStorage.clear();
var f=document.createElement('iframe');
f.style.cssText='width:900px;height:600px;border:0';
f.src='file:///C:/Users/Trk/Desktop/YDS/04_Github/durum.html';
f.onload=function(){var w=f.contentWindow;
setTimeout(function(){try{
  var Il=w.YDS.Ilerleme;
  ['used to','be bound to','be liable to','be prone to','hand down','make peace'].forEach(function(ad){
    var kk=Il.ilerlemeKimligi ? Il.ilerlemeKimligi(ad,'kelime') : '(yok)';
    var ok=Il.ilerlemeKimligi ? Il.ilerlemeKimligi(ad,'obek')  : '(yok)';
    P('  '+ad+':  kelime='+kk+'   öbek='+ok);
    esit(ad+' anahtarları ayrı', kk!==ok, true);
  });
  // Uçtan uca: kelimeyi bil, öbek etkilenmesin
  Il.dogru('used to','kelime');
  esit('kelime kutusu', Il.kutu('used to','kelime'), 1);
  esit('öbek dokunulmadı', Il.kutu('used to','obek'), 0);
  P('DONE '+(hata?hata+' HATA':'HEPSI GECTI'));
}catch(e){hata++;P('ERR '+e.message);P('DONE 1 HATA');}},1500);};
document.body.appendChild(f);
</script>
