<!DOCTYPE html><meta charset="utf-8"><title>kart arkasında kalıp</title>
<pre id="log"></pre>
<script>
var L=[];function P(m){L.push(m);document.getElementById('log').textContent=L.join('\n');}
localStorage.clear();
var f=document.createElement('iframe');
f.style.cssText='width:1100px;height:900px;border:0';
f.src='file:///C:/Users/Trk/Desktop/Turksev.github.io/kelimeler.html';
f.onload=function(){var w=f.contentWindow,d=f.contentDocument;
setTimeout(function(){try{
  var a=d.getElementById('ara'); a.value='object'; a.dispatchEvent(new w.Event('input'));
  setTimeout(function(){
    d.getElementById('mod').click();
    setTimeout(function(){
      d.getElementById('kart').click();          // kartı çevir
      setTimeout(function(){
        P('kart ön: '+d.getElementById('kartOn').textContent);
        var o=d.getElementById('kartOrnek');
        var k=o.querySelector('.kalip');
        P('kalıp bloğu var mı: '+!!k);
        if(k){
          var st=w.getComputedStyle(k);
          P('ortalı mı: '+st.justifyContent+' / '+st.textAlign);
          P('kalıp, örnek metninden önce mi: '+(o.firstElementChild===k));
          P('kalıplar: '+[].map.call(k.querySelectorAll('span b'),function(x){return x.textContent;}).join(' · '));
        }
        P('DONE');
      },400);
    },500);
  },900);
}catch(e){P('ERR '+e.message);}},1600);};
document.body.appendChild(f);
</script>
