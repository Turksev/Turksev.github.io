<!DOCTYPE html><meta charset="utf-8"><title>Node testleri (tarayici kabugu)</title>
<!-- CI'daki Node testlerini Node kurulu olmayan makinede kosturur.
     Neden gerekli: Quality is akisi hangi testin patladigini yalnizca is
     akisi gunlugune yaziyordu; gunluk disaridan okunamadigi icin kirmizi bir
     CI'yi yerelde yeniden uretmenin baska yolu yoktu.

     Kosum:
       chrome --headless=new --allow-file-access-from-files --dump-dom               tools/test-uretim/node-testleri-tarayicida.html
     Ciktidaki <pre> blogunu oku. --allow-file-access-from-files sart:
     dosyalar file:// uzerinden senkron XHR ile okunuyor.

     Kabugun sinirlari: fs/path/vm/assert/Buffer/process elle taklit edildi.
     Node'a birebir esit degil; PATLADI satiri once kabuk eksigi mi diye
     bakilmali (require edilmeyen bir modul, eksik fs islevi gibi). -->
<pre id="log"></pre>
<script>
/* CI'daki Node testlerini tarayicida kosturmak icin ince bir kabuk.
   Node kurulu olmadigi icin hangi testin patladigini baska turlu goremiyoruz.
   fs/path/vm/assert/Buffer taklit ediliyor; dosyalar file:// uzerinden
   senkron XHR ile okunuyor (--allow-file-access-from-files gerekir). */
var KOK = 'file:///C:/Users/Trk/Desktop/Turksev.github.io';
var L = [];
function P(m){ L.push(m); document.getElementById('log').textContent = L.join('\n'); }

function oku(mutlak){
  var x = new XMLHttpRequest();
  x.open('GET', mutlak, false);
  x.overrideMimeType('text/plain; charset=utf-8');
  x.send(null);
  if (x.status !== 0 && x.status !== 200) throw new Error('okunamadi: ' + mutlak);
  // BOM ve satir-ayirici kod noktalari new Function icinde sozdizimi hatasi verir.
  var s = x.responseText;
  if (s.charCodeAt(0) === 0xFEFF) s = s.slice(1);
  return s.replace(/\u2028|\u2029/g, '\n');
}

function normalize(p){
  var parca = p.replace(/\\/g, '/').split('/');
  var yig = [];
  for (var i = 0; i < parca.length; i++){
    if (parca[i] === '.' || parca[i] === '') { if (i === 0) yig.push(''); continue; }
    if (parca[i] === '..') { yig.pop(); continue; }
    yig.push(parca[i]);
  }
  return yig.join('/');
}

var path = {
  join: function(){ return normalize(Array.prototype.join.call(arguments, '/')); },
  resolve: function(){ return normalize(Array.prototype.join.call(arguments, '/')); },
  basename: function(p){ return p.split('/').pop(); },
  dirname: function(p){ var q = normalize(p).split('/'); q.pop(); return q.join('/') || '.'; },
  extname: function(p){ var b = p.split('/').pop(), i = b.lastIndexOf('.'); return i > 0 ? b.slice(i) : ''; },
  relative: function(a, b){ return normalize(b).replace(normalize(a) + '/', ''); },
  sep: '/'
};

function mutlakla(p){ return p.indexOf('file:') === 0 ? p : KOK + '/' + p.replace(/^\/+/, ''); }
var fs = {
  readFileSync: function(p){ return oku(mutlakla(p)); },
  existsSync: function(p){ try { fs.readFileSync(p); return true; } catch(e){ return false; } },
  statSync: function(p){
    var icerik = fs.readFileSync(p);
    return { size: new TextEncoder().encode(icerik).length,
             isFile: function(){ return true; }, isDirectory: function(){ return false; } };
  },
  readdirSync: function(p){
    // Chrome file:// dizin listesini HTML olarak verir; baglantilari ayikla.
    var html = oku(mutlakla(p).replace(/\/$/, '') + '/');
    var adlar = [], m, re = /addRow\("([^"]*)"/g;
    while ((m = re.exec(html))) if (m[1] !== '..') adlar.push(m[1]);
    return adlar;
  }
};

function AssertionError(msg){ var e = new Error(msg); e.name = 'AssertionError'; return e; }

/* Node'un deepStrictEqual'i anahtar sirasina duyarli degil; JSON.stringify
   karsilastirmasi sahte hata uretiyordu. Gercek derin karsilastirma: */
function esitMi(a, b){
  if (a === b) return true;
  if (typeof a !== typeof b) return false;
  if (a === null || b === null) return a === b;
  if (typeof a !== 'object') return a !== a && b !== b;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (a instanceof Set && b instanceof Set){
    if (a.size !== b.size) return false;
    var v, it = a.values();
    while (!(v = it.next()).done) if (!b.has(v.value)) return false;
    return true;
  }
  if (a instanceof Map && b instanceof Map){
    if (a.size !== b.size) return false;
    var m, mi = a.entries();
    while (!(m = mi.next()).done){
      if (!b.has(m.value[0]) || !esitMi(m.value[1], b.get(m.value[0]))) return false;
    }
    return true;
  }
  var ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  for (var i = 0; i < ka.length; i++){
    if (!Object.prototype.hasOwnProperty.call(b, ka[i])) return false;
    if (!esitMi(a[ka[i]], b[ka[i]])) return false;
  }
  return true;
}

function ozet(x){ try { return JSON.stringify(x).slice(0, 260); } catch(e){ return String(x); } }

var assert = function(k, m){ if (!k) throw AssertionError(m || 'assert basarisiz'); };
assert.ok = assert;
assert.strictEqual = function(a, b, m){
  if (a !== b) throw AssertionError((m ? m + ' | ' : '') + 'beklenen ' + ozet(b) + ', gelen ' + ozet(a));
};
assert.notStrictEqual = function(a, b, m){ if (a === b) throw AssertionError(m || 'esit olmamaliydi'); };
assert.deepStrictEqual = function(a, b, m){
  if (!esitMi(a, b)) throw AssertionError((m ? m + ' | ' : '') + 'derin esitlik yok  A=' + ozet(a) + '  B=' + ozet(b));
};
assert.throws = function(f, _e, m){
  var atti = false; try { f(); } catch(e){ atti = true; }
  if (!atti) throw AssertionError(m || 'hata atmasi bekleniyordu');
};
assert.doesNotThrow = function(f, m){ try { f(); } catch(e){ throw AssertionError((m || 'hata atmamaliydi') + ': ' + e.message); } };
assert.fail = function(m){ throw AssertionError(m || 'fail'); };

function baglamdaKos(kod, baglam){
  var adlar = Object.keys(baglam);
  var degerler = adlar.map(function(a){ return baglam[a]; });
  var f = new Function(adlar.join(','), '"use strict";' + kod + '\n;return {' +
    adlar.map(function(a){ return a + ':' + a; }).join(',') + '};');
  var sonuc = f.apply(null, degerler);
  adlar.forEach(function(a){ baglam[a] = sonuc[a]; });
}

function Script(kod){ this.kod = kod; }
Script.prototype.runInContext = function(baglam){ return baglamdaKos(this.kod, baglam); };
Script.prototype.runInNewContext = function(baglam){ return baglamdaKos(this.kod, baglam || {}); };

var vm = {
  Script: Script,
  createContext: function(o){ return o || {}; },
  runInContext: baglamdaKos,
  runInNewContext: function(kod, baglam){ return baglamdaKos(kod, baglam || {}); }
};

var Buffer = { byteLength: function(s){ return new TextEncoder().encode(String(s)).length; } };

function gerekli(ad){
  if (ad === 'fs') return fs;
  if (ad === 'path') return path;
  if (ad === 'vm') return vm;
  if (ad === 'assert' || ad === 'assert/strict' || ad === 'node:assert') return assert;
  throw new Error('kabukta yok: require("' + ad + '")');
}

var TESTLER = ['icerik-butunluk','konu-kapsam','kaynak-manifest','kelime-provenans',
  'kelime-alias-gecis','deneme-formlari','deneme-oturum','ilerleme-srs',
  'ayarlar-ice-aktarma','esitleme-veri','esitleme-depo','esitleme-boyut',
  'esitleme-yerel-guvenlik','esitleme-bulut','esitleme-cdn','esitleme-entegrasyon',
  'firestore-kurallar','statik-yayin','yeniden-yukleme'];

var ciktilar = [], patlayan = 0;
TESTLER.forEach(function(ad){
  var yol = 'tools/test-uretim/' + ad + '-test.js';
  var kod;
  try { kod = fs.readFileSync(yol); }
  catch(e){ P('ATLA    ' + ad + ' (dosya okunamadi)'); return; }
  // Bazi testler hata durumunu atmadan bildiriyor: console.error + process.exitCode.
  // Kabuk bunu yutmamali, yoksa CI'da kirmizi olan test burada yesil gorunur.
  var hataSatirlari = [];
  var sahteKonsol = {
    log: function(){ ciktilar.push(Array.prototype.join.call(arguments, ' ')); },
    error: function(){ hataSatirlari.push(Array.prototype.join.call(arguments, ' ')); },
    warn: function(){ hataSatirlari.push(Array.prototype.join.call(arguments, ' ')); }
  };
  var sahteSurec = { argv: [], env: {}, platform: 'linux', exitCode: 0,
                     exit: function(k){ sahteSurec.exitCode = k || 0; } };
  // Node shebang satirini yok sayar; new Function saymaz.
  if (kod.slice(0, 2) === '#!') kod = '//' + kod.slice(2);
  try {
    var f = new Function('require','__dirname','__filename','module','exports','console','Buffer','process',
      '"use strict";' + kod);
    f(gerekli, KOK + '/tools/test-uretim', KOK + '/' + yol, { exports: {} }, {}, sahteKonsol, Buffer,
      sahteSurec);
    if (sahteSurec.exitCode){
      patlayan++;
      P('PATLADI ' + ad + '  [exitCode ' + sahteSurec.exitCode + ']');
      hataSatirlari.slice(0, 12).forEach(function(h){ P('        ' + h.slice(0, 300)); });
    } else {
      P('GECTI   ' + ad);
    }
  } catch(e){
    patlayan++;
    P('PATLADI ' + ad + '  [' + e.name + '] ' + (e.message || '').slice(0, 420));
  }
});
P('');
P('--- testlerin kendi ciktilari ---');
ciktilar.forEach(function(c){ P('  ' + c); });
P(patlayan ? 'DONE ' + patlayan + ' PATLADI' : 'DONE HEPSI GECTI');
</script>
